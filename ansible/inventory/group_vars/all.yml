---
# Safe defaults: validation does not start services or require Docker.
infrawatch_build_image: true
infrawatch_validate_compose: true
infrawatch_verify_retries: 5
infrawatch_verify_delay: 3

infrawatch_api_health_url: http://127.0.0.1:8000/health
infrawatch_api_status_url: http://127.0.0.1:8000/status
infrawatch_prometheus_ready_url: http://127.0.0.1:9090/-/ready
infrawatch_grafana_health_url: http://127.0.0.1:3000/api/health
infrawatch_compose_project_name: infrawatch-ansible-local
infrawatch_bind_address: 127.0.0.1
infrawatch_api_port: 18000
infrawatch_prometheus_port: 19090
infrawatch_grafana_port: 13000